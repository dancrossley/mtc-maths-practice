<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Times Tables Practice</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Times Tables" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section id="splash-screen" class="screen splash-screen" role="button" tabindex="0" aria-label="Tap to start">
      <img src="icons/splash.png" alt="" class="splash-image" />
      <p class="splash-cta">Tap to start</p>
    </section>

    <section id="name-screen" class="screen hidden">
      <h1>Who's practising?</h1>
      <p class="subtitle">Enter your name to track your scores</p>
      <form id="name-form" autocomplete="off">
        <input
          id="name-input"
          type="text"
          maxlength="20"
          autocomplete="off"
          class="name-input"
          placeholder="Your name"
          aria-label="Your name"
        />
        <button type="submit" class="primary-btn">Continue</button>
      </form>
    </section>

    <section id="start-screen" class="screen hidden">
      <h1>Times Tables Practice</h1>
      <p id="user-greeting" class="user-greeting"></p>
      <p class="subtitle">1× through 12×</p>
      <p class="instructions">25 questions &middot; 6 seconds each</p>
      <div id="user-history" class="user-history"></div>
      <button id="start-btn" class="primary-btn">Start test</button>
      <div class="screen-footer">
        <button id="switch-user-btn" type="button" class="link-btn">Switch user</button>
      </div>
    </section>

    <section id="question-screen" class="screen hidden">
      <header class="status-bar">
        <span id="question-counter">Question 1 of 25</span>
        <button id="pause-btn" class="pause-btn hidden" aria-label="Pause test">Pause</button>
        <span id="score-display">Score: 0</span>
      </header>

      <div class="timer-wrap">
        <div id="timer-bar" class="timer-bar"></div>
        <span id="timer-text" class="timer-text">6</span>
      </div>

      <div class="question-wrap">
      <div id="pause-overlay" class="pause-overlay hidden">
        <p class="pause-label">Paused</p>
      </div>

      <div id="question-card" class="question-card">
        <div id="question-text" class="question-text">0 × 0 = ?</div>
        <form id="answer-form" autocomplete="off">
          <input
            id="answer-input"
            type="text"
            inputmode="none"
            readonly
            class="answer-input"
            aria-label="Your answer"
          />
          <div class="numpad" id="numpad">
            <button type="button" class="numpad-btn" data-digit="1">1</button>
            <button type="button" class="numpad-btn" data-digit="2">2</button>
            <button type="button" class="numpad-btn" data-digit="3">3</button>
            <button type="button" class="numpad-btn" data-digit="4">4</button>
            <button type="button" class="numpad-btn" data-digit="5">5</button>
            <button type="button" class="numpad-btn" data-digit="6">6</button>
            <button type="button" class="numpad-btn" data-digit="7">7</button>
            <button type="button" class="numpad-btn" data-digit="8">8</button>
            <button type="button" class="numpad-btn" data-digit="9">9</button>
            <button type="button" id="backspace-btn" class="numpad-btn action backspace" aria-label="Backspace">
              <img src="icons/backspace.png" alt="" />
            </button>
            <button type="button" class="numpad-btn" data-digit="0">0</button>
            <button type="submit" id="submit-btn" class="numpad-btn action submit" aria-label="Submit">
              <img src="icons/submit.png" alt="" />
            </button>
          </div>
        </form>
        <div id="feedback" class="feedback" aria-live="polite"></div>
      </div>
      </div><!-- /.question-wrap -->
    </section>

    <section id="results-screen" class="screen hidden">
      <h1>Test complete</h1>
      <p id="final-score" class="final-score">Score: 0 / 25</p>
      <div id="results-history" class="results-history"></div>
      <h2 id="mistakes-heading" class="mistakes-heading hidden">Review</h2>
      <ul id="mistakes-list" class="mistakes-list"></ul>
      <button id="restart-btn" class="primary-btn">Try again</button>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
